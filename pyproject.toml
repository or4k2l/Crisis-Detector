[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crisis-detector"
version = "1.0.0"
description = "A unified framework for detecting anomalies and crises across multiple domains"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "or4k2l" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
]

[project.optional-dependencies]
finance = ["yfinance>=0.1.70", "statsmodels>=0.13.0"]
seismic = ["obspy>=1.3.0"]
gravitational = ["gwpy>=3.0.0"]
neuro = ["mne>=1.0.0"]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "pytest-cov>=3.0.0",
]
all = [
    # Mirrors the union of all optional-dependency groups above.
    # pyproject.toml is a static format, so these must be listed explicitly.
    "yfinance>=0.1.70",
    "statsmodels>=0.13.0",
    "obspy>=1.3.0",
    "gwpy>=3.0.0",
    "mne>=1.0.0",
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "pytest-cov>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/or4k2l/Crisis-Detector"

[tool.setuptools.packages.find]
where = ["."]
include = ["crisis_detector*"]
